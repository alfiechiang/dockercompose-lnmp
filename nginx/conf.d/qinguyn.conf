server {
    listen 80;
    server_name asx.cv;

    root  /var/www/qingyun/;
    index index.php index.html index.htm;
    charset utf-8;

    # 路由：保留 query，避免把 ? 黏到 action 名稱
    location / {
        try_files $uri $uri/ /index.php?s=$uri&$args;  # ← 注意沒有多餘的斜線
    }

    # 常見掃描檔案禁止存取（你原本的規則保留）
    location ~* (\.git|\.env(\.dev|\.example)?|\.gitignore|\.gitlab-ci\.yml|\.dist|\.md|\.ini|package\.json|package-lock\.json|pm2\.json|composer\.json|composer\.lock|\.sh|LICENSE|\.xml|\.travis\.yml|Makefile|\.rst|\.py|VERSION)$ {
        deny all;
    }

    # PHP 丟給 FPM
    location ~ \.php$ {
        try_files $uri =404;  # 檔案不存在直接 404，避免迴圈
        include fastcgi_params;
        fastcgi_pass   app:9000;                     # ← 確認這個主機名/埠號真的可連
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # 合理的逾時
        fastcgi_connect_timeout 3s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
    }

    error_page   500 502 503 504  /50x.html;
    error_page   403              /403.html;
    location = /50x.html { root /usr/share/nginx/html; }
    location = /403.html {  root /usr/share/nginx/html; }
}















































