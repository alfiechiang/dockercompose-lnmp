version: '3.8'

services:
  app:
    build:
      context: ./php
    image: app
    container_name: app
    volumes:
      - ./www:/var/www
    depends_on:
      - mysql
    networks:
      - appnet
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "15672:15672"   # Web
      - "5672:5672" 
    environment:
      RABBITMQ_DEFAULT_USER: appuser
      RABBITMQ_DEFAULT_PASS: strongpass
      RABBITMQ_DEFAULT_VHOST: /
    networks:
      - appnet
  hyperf:
    build:
      context: .                 # ← 專案根
      dockerfile: hyperf/Dockerfile
    image: hyperf
    container_name: hyperf
    working_dir: /var/www
    platform: linux/arm64/v8
    environment:
      APP_ENV: dev
    volumes:
      - ./www:/var/www
      - ./hyperf/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    ports:
      - "9501:9501"         # 方便你直接用 http://localhost:4001 測試（要的話保留）
    depends_on:
      - mysql
      - rabbitmq
      - redis
    networks:
      - appnet
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - appnet
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: giant
      MYSQL_PASSWORD: 123456
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: test_db
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - appnet

  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - app
      - hyperf
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/log/error.log:/var/log/nginx/error.log
      - ./www:/var/www:ro
    ports:
      - "80:80"
    networks:
      - appnet
volumes:
  mysql_data:
  redis_data:
networks:
  appnet:
    driver: bridge
